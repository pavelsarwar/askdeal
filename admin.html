<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAPS Admin</title><link rel="stylesheet" href="assets/style.css"><link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet"><style>.admin-shell{width:min(1280px,94%);margin:30px auto}.admin-login{max-width:460px;margin:70px auto}.admin-grid{display:grid;grid-template-columns:230px 1fr;gap:20px}.admin-nav button{width:100%;margin-bottom:8px;text-align:left}.admin-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.admin-form .full{grid-column:1/-1}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:10px;border-bottom:1px solid #e5e9f0;text-align:left;font-size:13px}.offer-editor-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.offer-main textarea{width:100%;border:1px solid #e5e9f0;border-radius:10px;padding:12px;font:inherit}.offer-main input,.offer-side input,.offer-side select{width:100%}.ql-editor{min-height:360px;font-size:16px;line-height:1.65}.ql-editor img{max-width:100%;height:auto}.offer-side{align-self:start;position:sticky;top:90px}.best-badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#ecfdf3;color:#027a48;font-size:11px;font-weight:800}.login-help{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0 18px}.login-help button{border:0;background:transparent;padding:0;color:#475467;font-size:12px;font-weight:800;cursor:pointer}.login-help button:hover{color:#e53935}.recovery-box{margin-top:16px;padding:16px;border:1px solid #e5e9f0;border-radius:14px;background:#f9fafb}.recovery-box h3{margin:0 0 8px}.recovery-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:900px){.admin-grid,.offer-editor-layout{grid-template-columns:1fr}.offer-side{position:static}}@media(max-width:760px){.admin-form{grid-template-columns:1fr}.admin-form .full{grid-column:auto}}</style></head><body>
<div class="topbar"><div class="container"><div>🔐 NAPS Administration</div><div>Nationwide Affordable Price Search</div></div></div>
<div id="loginView" class="admin-login card"><h2>Admin Login</h2><p class="lead" style="font-size:14px">Sign in with your NAPS admin email and password.</p><div class="field"><label>Email / Username</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div><div class="login-help"><button type="button" onclick="showForgotEmail()">Forgot email / username?</button><button type="button" onclick="showForgotPassword()">Forgot password?</button></div><button class="btn btn-primary" style="width:100%" onclick="adminLogin()">Sign In</button><div id="loginMsg" class="hint"></div><div id="recoveryPanel"></div></div>
<div id="adminView" class="admin-shell" style="display:none"><div class="deals-head"><div><h1 style="font-size:32px;margin:0">NAPS Admin</h1><div class="result-count">Manage dynamic website data</div></div><button class="btn btn-light" onclick="adminLogout()">Sign out</button></div><div class="admin-grid"><aside class="card admin-nav"><button class="btn btn-primary" onclick="showSubmissionQueue()">📥 Pending Submissions</button><button class="btn btn-primary" onclick="showOffersCMS()">📝 Offer Posts</button><button class="btn btn-primary" onclick="showPromoCodesCMS()">🎫 Promo Codes</button><button class="btn btn-primary" onclick="showHomepageSettings()">🏠 Homepage Highlight</button><button class="btn btn-primary" onclick="showUserManagement()">👥 User Management</button><button class="btn btn-light" onclick="showModule('menu')">☰ Menu Manager</button><button class="btn btn-light" onclick="showModule('products')">📦 Products</button><button class="btn btn-light" onclick="showModule('merchants')">🏪 Merchants</button><button class="btn btn-light" onclick="showModule('prices')">💰 Product Prices</button><button class="btn btn-light" onclick="showModule('gold')">💎 Gold Rates</button><button class="btn btn-light" onclick="showModule('remittance')">💱 Remittance Rates</button><button class="btn btn-light" onclick="showModule('fuel')">⛽ Fuel Prices</button><button class="btn btn-light" onclick="showModule('hospitals')">🏥 Hospitals</button><button class="btn btn-light" onclick="showModule('articles')">📘 Articles</button></aside><main><div id="moduleCard" class="card"><h2>Dashboard</h2><p>Manage offers, promo codes, submissions, homepage content and other NAPS data from this panel.</p></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script><script src="assets/supabase-config.js"></script><script src="assets/admin.js"></script><script src="assets/offers-admin.js"></script><script src="assets/promo-admin.js"></script><script src="assets/submission-queue.js"></script><script src="assets/homepage-admin.js"></script><script src="assets/user-management.js"></script><script src="assets/clean-url.js"></script></body></html>
